:root{--bg:#f8f2e9;--card:#fffdf8;--ink:#35292a;--mut:#7b6c66;--acc:#74474a;--rose:#ecd5d0;--sage:#dde6d6;--sageD:#566b4f;--line:#e8dccb;--gold:#b08d57;--sh:0 1px 2px rgba(90,60,50,.05),0 10px 28px -14px rgba(90,60,50,.18)}

.empty.card{border-style:dashed;background:transparent;box-shadow:none;padding:48px 20px}
button.b,a.b{padding:11px 26px;letter-spacing:.02em;min-height:42px;box-shadow:0 8px 18px -10px var(--acc);transition:filter .2s}button.b:hover,a.b:hover{filter:brightness(1.1)}

<script>
const $=s=>document.querySelector(s),KEY='zmilosci_planer_v1',VER=1;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({v:VER,settings:{n1:'',n2:'',date:'',budget:null,cer:[],city:'',prev:false,foreign:false,outside:false,guestsPlan:null},expenses:[],tasks:[],guests:[],formal:{},vendors:[],tables:[],groups:['Znajomi','Rodzina ABC','Rodzina XYZ','Kuzyni'],insp:[],chk:{},custom:{}});
let S,storeOK=true,page='dash',flt={task:'all',rsvp:'all',q:'',exp:'all'};
function migrate(o){if(!o||typeof o!=='object'||Array.isArray(o))throw new Error('Plik nie zawiera obiektu danych aplikacji.');const b=blank();const m={...b,...o,v:VER,settings:{...b.settings,...(o.settings||{})}};['vendors','tables'].forEach(k=>{if(!Array.isArray(m[k]))m[k]=[]});if(!Array.isArray(m.groups))m.groups=[...b.groups];if(!Array.isArray(m.insp))m.insp=[];['chk','custom'].forEach(k=>{if(!m[k]||typeof m[k]!=='object'||Array.isArray(m[k]))m[k]={}});(Array.isArray(m.guests)?m.guests:[]).forEach(g=>{if(!SIDES.includes(g.side)){if(g.side&&!g.group)g.group=g.side;g.side='Inna'}if(g.group&&!m.groups.includes(g.group))m.groups.push(g.group)});return m}
function load(){try{const r=localStorage.getItem(KEY);S=r?migrate(JSON.parse(r)):blank()}catch(e){S=blank();storeOK=false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storeOK=false}}
const pln=n=>(n==null?'—':new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN',maximumFractionDigits:2}).format(n));
const fd=d=>d?d.split('-').reverse().join('.'):'—';
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const daysTo=s=>Math.round((pd(s)-today())/864e5);
/* ---- model budżetu ---- */
const cost=e=>e.final??e.agreed??e.planned??null;
const paid=e=>(e.payments||[]).reduce((a,p)=>a+p.amount,0);
const remain=e=>cost(e)==null?null:cost(e)-paid(e);
function pstat(e){const c=cost(e),p=paid(e);if(c!=null&&c>0&&p>=c)return['opłacone',''];if(p>0)return['częściowo opłacone',''];if(e.due&&c!=null&&daysTo(e.due)<0)return['przeterminowane','w'];return['zaplanowane','n']}
function bud(){const E=S.expenses,sum=f=>E.reduce((a,e)=>a+(f(e)||0),0);const forecast=sum(cost),p=sum(paid);
const due=n=>E.filter(e=>e.due&&remain(e)>0&&daysTo(e.due)>=0&&daysTo(e.due)<=n).reduce((a,e)=>a+remain(e),0);
return{planned:sum(e=>e.planned),agreed:sum(e=>e.agreed),paid:p,forecast,left:E.reduce((a,e)=>a+Math.max(remain(e)||0,0),0),free:S.settings.budget==null?null:S.settings.budget-forecast,d7:due(7),d30:due(30),d90:due(90)}}
/* ---- goście ---- */
const persons=g=>1+(+g.plus||0)+(+g.kids||0);
function gst(){const G=S.guests,s=f=>G.reduce((a,g)=>a+f(g),0);return{invited:s(persons),yes:s(g=>g.rsvp==='yes'?persons(g):0),no:s(g=>g.rsvp==='no'?persons(g):0),wait:s(g=>g.rsvp==='wait'?persons(g):0),kids:s(g=>g.kids||0),meals:s(g=>g.rsvp==='yes'?persons(g):0)}}

function genTasks(){let n=0;TPL.forEach((x,i)=>{const k='t'+i;if(!S.tasks.some(t=>t.tpl===k)){S.tasks.push({id:uid(),tpl:k,days:x[0],title:x[1],desc:x[2],cat:x[3],due:'',manual:false,done:false,owner:'',prio:'średni'});n++}});recalc();return n}

['c1','Termin i miejsce ceremonii w USC',['usc','con'],'Potwierdź w USC','Właściwy Urząd Stanu Cywilnego','Zapytajcie o wolne terminy i sposób zgłoszenia.','Jakie terminy są wolne? Jak zgłosić ślub? Jaka jest opłata?','Orientacyjnie: kilka miesięcy przed ślubem.'],
['c2','Ślub poza USC: zasady, termin i dodatkowa opłata',['out'],'Potwierdź w USC','Urząd Stanu Cywilnego','Sprawdźcie, czy wybrane miejsce jest możliwe i jaka jest dodatkowa opłata.','Jakie wymagania ma miejsce? Ile wynosi opłata?','Jak najwcześniej, bo liczba terminów bywa ograniczona.'],
['c3','Dokumenty tożsamości narzeczonych',['usc','out','con'],'Zwykle wymagane','USC (wizyta przed ślubem)','Sprawdźcie, które dokumenty USC potrzebuje.','Jakie dokumenty tożsamości przyjmuje USC?','Przed wizytą w USC.'],
['c4','Dane i oświadczenia składane przed kierownikiem USC',['usc','out','con'],'Zwykle wymagane','USC','Zapytajcie, jakie dane i oświadczenia trzeba złożyć i kiedy.','Kiedy składa się oświadczenia? Kto musi być obecny?','Termin ustala USC.'],
['c5','Dane i dokumenty tożsamości świadków',['usc','out','con'],'Zwykle wymagane','USC','Ustalcie świadków i przypomnijcie im o dokumentach.','Jakich danych świadków wymaga USC?','Na kilka tygodni przed ślubem.'],
['c6','Opłata za akt małżeństwa',['usc','out'],'Zależne od sytuacji','USC','Zapytajcie, czy opłata dotyczy Waszej sytuacji i jak ją wnieść.','Czy opłata obowiązuje? Jaka kwota i forma płatności?','Zgodnie z instrukcją USC.'],
['c7','Dokumenty dodatkowe w Waszej sytuacji',['usc','out','con'],'Zależne od sytuacji','USC','Opiszcie urzędnikowi swoją sytuację i zapytajcie o dodatkowe dokumenty.','Czy w naszej sytuacji potrzeba czegoś więcej?','Przy pierwszym kontakcie.'],
['c8','Wcześniejsze małżeństwo: dokumenty o możliwości zawarcia nowego',['usc','out','con'],'Zależne od sytuacji','USC','Zapytajcie, jakie dokumenty potwierdzą ustanie poprzedniego małżeństwa.','Jakie dokumenty są potrzebne i gdzie je uzyskać?','Wcześnie, bo uzyskanie dokumentów może trwać.'],

let toastT;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--acc);color:var(--onacc);padding:10px 20px;border-radius:999px;z-index:20;font-size:.9rem';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2600)}
function change(){recalc();save();render()}
function form(title,fields,vals,cb,extra){const d=$('#dlg');vals=vals||{};
d.innerHTML=`<h2>${esc(title)}</h2><form id="f" novalidate>${fields.map(([k,l,t,o])=>t==='check'?`<label class="ck"><input type="checkbox" name="${k}" ${vals[k]?'checked':''}>${esc(l)}</label>`:`<label>${esc(l)}${t==='select'?`<select name="${k}">${o.map(x=>`<option ${vals[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:t==='area'?`<textarea name="${k}" rows="3">${esc(vals[k])}</textarea>`:`<input name="${k}" type="${t==='money'?'number':t}" ${t==='money'?'step="0.01" min="0"':''} value="${esc(vals[k])}">`}</label>`).join('')}<div class="err" id="ferr" role="alert"></div><div class="tools"><button class="b" type="submit">Zapisz</button><button class="g" type="button" onclick="$('#dlg').close()">Anuluj</button></div></form>`;
$('#f').onsubmit=e=>{e.preventDefault();const o={};for(const[k,l,t]of fields){const el=$('#f').elements[k];o[k]=t==='check'?el.checked:t==='money'?(el.value===''?null:parseFloat(el.value)):el.value.trim();if(t==='money'&&o[k]!=null&&(isNaN(o[k])||o[k]<0)){$('#ferr').textContent=`Pole „${l}” wymaga kwoty nie mniejszej niż 0.`;return}}
const err=extra&&extra(o);if(err){$('#ferr').textContent=err;return}cb(o);d.close()};d.showModal()}
const req=(k,msg)=>o=>o[k]?'':msg;
function confirmDel(msg,fn){const d=$('#dlg');d.innerHTML=`<h2>Na pewno?</h2><p>${esc(msg)}</p><div class="tools"><button class="b" id="yes">Usuń</button><button class="g" onclick="$('#dlg').close()">Anuluj</button></div>`;$('#yes').onclick=()=>{fn();d.close();toast('Usunięto')};d.showModal()}

const V={};

${warns.map(w=>`<div class="banner" role="alert">${esc(w)}</div>`).join('')}
<div class="grid"><button class="stat" onclick="go('budget')"><b>${pln(s.budget)}</b><span>Budżet maksymalny</span></button><button class="stat" onclick="go('budget')"><b>${pln(b.forecast)}</b><span>Prognozowany koszt</span></button><button class="stat" onclick="go('budget')"><b>${pln(b.paid)}</b><span>Zapłacono</span></button><button class="stat" onclick="go('budget')"><b>${pln(b.left)}</b><span>Pozostało do zapłaty</span></button><button class="stat" onclick="go('budget')"><b>${pln(b.free)}</b><span>Budżet do rozdysponowania</span></button>
<button class="stat" onclick="go('guests')"><b>${g.invited}</b><span>Osób zaproszonych (potwierdzone: ${g.yes}, oczekuje: ${g.wait})</span></button><button class="stat" onclick="go('tasks')"><b>${dn}/${T.length}</b><span>Zadań ukończonych</span></button><button class="stat" onclick="go('formal')"><b>${fr}/${fv.length}</b><span>Formalności gotowych</span></button><button class="stat" onclick="go('vendors')"><b>${S.vendors.filter(v=>BOOKED.includes(v.status)).length}/${S.vendors.length}</b><span>Usługodawców zarezerwowanych</span></button></div>
<div class="card"><h3>Postęp przygotowań: ${pr}%</h3><div class="bar"><i style="width:${pr}%"></i></div><p class="mut">Liczymy odsetek ukończonych zadań. ${T.length?'':'Nie macie jeszcze zadań. '}<a href="#" onclick="event.preventDefault();addTpl()">Wygeneruj plan z szablonu</a></p></div>
${sideCard()}<div class="card"><h3>Najbliższe terminy</h3>${up.length?up.map(t=>`<div class="row"><span>${esc(t.title)}</span><span class="mut">${fd(t.due)}</span></div>`).join(''):'<p class="mut">Brak zadań z terminem. Ustawcie datę ślubu, aby terminy wyliczyły się automatycznie.</p>'}</div>
<div class="card"><h3>Najbliższe płatności</h3>${pays.length?pays.map(e=>`<div class="row"><span>${esc(e.name)}</span><span class="mut">${pln(remain(e))} do ${fd(e.due)}</span></div>`).join(''):'<p class="mut">Brak zaplanowanych płatności z terminem.</p>'}<p class="mut">W 7 dni: ${pln(b.d7)}. W 30 dni: ${pln(b.d30)}. W 90 dni: ${pln(b.d90)}.</p></div>`};

V.budget=()=>{const b=bud();let E=S.expenses.filter(e=>(flt.exp==='all'||e.cat===flt.exp)&&(!flt.q||e.name.toLowerCase().includes(flt.q.toLowerCase())));const ca=CATS.filter(c=>S.expenses.some(e=>e.cat===c));

<div class="tools"><button class="b" onclick="editExp()">Dodaj wydatek</button><button class="g" onclick="editBudget()">Ustaw budżet całkowity</button><select aria-label="Kategoria" onchange="flt.exp=this.value;render()"><option value="all">Wszystkie kategorie</option>${ca.map(c=>`<option ${flt.exp===c?'selected':''}>${c}</option>`).join('')}</select></div>
${E.length?E.map(e=>{const[st,cl]=pstat(e);return`<div class="card"><div class="row" style="border:0;padding:0"><div><h3 style="margin:0">${esc(e.name)}</h3><span class="mut">${esc(e.cat)}${e.vendor?' · '+esc(e.vendor):''}${e.contract?' · umowa '+esc(e.contract):''}</span></div><span class="tag ${cl}">${st}</span></div>
<p class="mut" style="margin:8px 0">Plan: ${pln(e.planned)}. Uzgodniono: ${pln(e.agreed)}. Koszt końcowy: ${pln(e.final)}. Wpłacono: ${pln(paid(e))}. <b>Zostało: ${pln(remain(e))}</b>${e.due?`. Termin: ${fd(e.due)}`:''}</p>
${(e.payments||[]).map(p=>`<span class="tag n">${fd(p.date)}: ${pln(p.amount)} <button class="x" aria-label="Usuń wpłatę" onclick="delPay('${e.id}','${p.id}')">×</button></span> `).join('')}
<div class="tools" style="margin:10px 0 0"><button class="g" onclick="addPay('${e.id}')">Dodaj wpłatę</button><button class="g" onclick="editExp('${e.id}')">Edytuj</button><button class="g" onclick="dupExp('${e.id}')">Duplikuj</button><button class="g" onclick="confirmDel('Usunąć wydatek „${esc(e.name).replace(/'/g,'')}” razem z wpłatami?',()=>{S.expenses=S.expenses.filter(x=>x.id!=='${e.id}');change()})">Usuń</button></div></div>`}).join(''):`<div class="empty card">Nie ma jeszcze wydatków. Dodajcie pierwszy, np. salę lub fotografa.</div>`}`};
function editBudget(){form('Budżet całkowity',[['budget','Kwota (PLN)','money']],{budget:S.settings.budget},o=>{S.settings.budget=o.budget;change();toast('Zapisano budżet')})}
function editExp(id){const e=id&&S.expenses.find(x=>x.id===id);form(e?'Edytuj wydatek':'Nowy wydatek',[['name','Nazwa','text'],['cat','Kategoria','select',CATS],vendorField(e),['planned','Koszt planowany (PLN)','money'],['agreed','Koszt uzgodniony (PLN)','money'],['final','Koszt końcowy (PLN)','money'],['due','Termin płatności','date'],['contract','Numer umowy','text'],['notes','Notatki','area']],e||{cat:CATS[0]},o=>{if(e)Object.assign(e,o);else S.expenses.push({id:uid(),payments:[],...o});change();toast('Zapisano wydatek')},req('name','Podaj nazwę wydatku.'))}
function addPay(id){const e=S.expenses.find(x=>x.id===id);form('Nowa wpłata',[['amount','Kwota (PLN)','money'],['date','Data wpłaty','date']],{date:iso(today())},o=>{(e.payments=e.payments||[]).push({id:uid(),amount:o.amount,date:o.date});change();if(cost(e)!=null&&paid(e)>cost(e))toast('Uwaga: wpłaty przekraczają deklarowany koszt');else toast('Zapisano wpłatę')},o=>o.amount==null||o.amount<=0?'Podaj kwotę większą od 0.':'')}
const delPay=(id,pid)=>{const e=S.expenses.find(x=>x.id===id);e.payments=e.payments.filter(p=>p.id!==pid);change()};
const dupExp=id=>{const e=S.expenses.find(x=>x.id===id);S.expenses.push({...e,id:uid(),name:e.name+' (kopia)',payments:[]});change();toast('Zduplikowano')};

V.tasks=()=>{const f=flt.task,td=iso(today());let L=S.tasks.filter(t=>f==='all'||(f==='todo'&&!t.done)||(f==='done'&&t.done)||(f==='late'&&!t.done&&t.due&&t.due<td)||(f==='soon'&&!t.done&&t.due&&daysTo(t.due)>=0&&daysTo(t.due)<=30));
if(f==='soon')L.sort((a,b)=>a.due.localeCompare(b.due));
return`<h1>Zadania</h1><div class="tools"><button class="b" onclick="editTask()">Dodaj zadanie</button><button class="g" onclick="addTpl()">Dodaj zadania z szablonu</button><select aria-label="Widok" onchange="flt.task=this.value;render()">${[['all','Wszystkie'],['todo','Do zrobienia'],['done','Ukończone'],['late','Przeterminowane'],['soon','Najbliższe 30 dni']].map(([k,l])=>`<option value="${k}" ${f===k?'selected':''}>${l}</option>`).join('')}</select></div>
${L.length?L.map(t=>`<div class="card"><div class="row" style="border:0;padding:0"><label class="ck" style="margin:0"><input type="checkbox" ${t.done?'checked':''} onchange="togTask('${t.id}')"><span style="${t.done?'text-decoration:line-through;color:var(--mut)':''}"><b>${esc(t.title)}</b></span></label><span class="mut">${t.due?fd(t.due):'bez terminu'}</span></div><p class="mut" style="margin:6px 0">${esc(t.desc)}</p><span class="tag n">${esc(t.cat)}</span> ${t.owner?`<span class="tag n">${esc(t.owner)}</span>`:''} ${!t.done&&t.due&&t.due<td?'<span class="tag w">po terminie</span>':''}
<div class="tools" style="margin:10px 0 0"><button class="g" onclick="editTask('${t.id}')">Edytuj</button><button class="g" onclick="moveTask('${t.id}',-1)" aria-label="Przesuń w górę">W górę</button><button class="g" onclick="moveTask('${t.id}',1)" aria-label="Przesuń w dół">W dół</button><button class="g" onclick="confirmDel('Usunąć to zadanie?',()=>{S.tasks=S.tasks.filter(x=>x.id!=='${t.id}');change()})">Usuń</button></div></div>`).join(''):'<div class="empty card">Brak zadań w tym widoku. Możecie dodać własne lub wygenerować plan z szablonu.</div>'}`};
const togTask=id=>{const t=S.tasks.find(x=>x.id===id);t.done=!t.done;change()};
function moveTask(id,d){const i=S.tasks.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=S.tasks.length)return;[S.tasks[i],S.tasks[j]]=[S.tasks[j],S.tasks[i]];change()}
function editTask(id){const t=id&&S.tasks.find(x=>x.id===id);form(t?'Edytuj zadanie':'Nowe zadanie',[['title','Tytuł','text'],['desc','Opis (co i dlaczego)','area'],['cat','Kategoria','text'],['due','Termin','date'],['owner','Osoba odpowiedzialna','text'],['prio','Priorytet','select',['niski','średni','wysoki']]],t||{prio:'średni'},o=>{if(t){if(t.tpl&&o.due!==t.due)t.manual=true;Object.assign(t,o)}else S.tasks.push({id:uid(),done:false,manual:true,...o});change()},req('title','Podaj tytuł zadania.'))}

function gl(){const L=S.guests.filter(x=>(flt.rsvp==='all'||x.rsvp===flt.rsvp)&&(!flt.q||(x.name+' '+(x.side||'')).toLowerCase().includes(flt.q.toLowerCase())));return L.length?L.map(x=>`<div class="card"><div class="row" style="border:0;padding:0"><div><b>${esc(x.name)}</b> <span class="mut">${esc(x.side||'')}${x.group?' · '+esc(x.group):''} · ${persons(x)} os.</span></div><span class="tag ${x.rsvp==='yes'?'':x.rsvp==='no'?'w':'n'}">${RS[x.rsvp]}</span></div><p class="mut" style="margin:6px 0">${[x.plus?`osoby towarzyszące: ${x.plus}`:'',x.kids?`dzieci: ${x.kids}`:'',x.diet&&'dieta: '+x.diet,x.allergy&&'alergie: '+x.allergy,x.lodging&&'nocleg',x.table&&'stół '+x.table,x.notes].filter(Boolean).map(esc).join(' · ')}</p><div class="tools" style="margin:0"><button class="g" onclick="editGuest('${x.id}')">Edytuj</button><button class="g" onclick="confirmDel('Usunąć gościa?',()=>{S.guests=S.guests.filter(y=>y.id!=='${x.id}');change()})">Usuń</button></div></div>`).join(''):'<div class="empty card">Brak gości w tym widoku. Dodajcie pierwszą osobę.</div>'}
function editGuest(id){const x=id&&S.guests.find(y=>y.id===id);form(x?'Edytuj gościa':'Nowy gość',[['name','Imię i nazwisko','text'],['side','Strona','select',SIDES],['group','Grupa','select',['',...S.groups,...(x&&x.group&&!S.groups.includes(x.group)?[x.group]:[])]],['rsvp','Status RSVP','select',Object.keys(RS)],['plus','Osoby towarzyszące','number'],['kids','Dzieci','number'],['diet','Preferencje żywieniowe','text'],['allergy','Alergie','text'],['lodging','Potrzebuje noclegu','check'],['table','Stół','select',tableOpts(x&&x.table)],['notes','Uwagi','area']],x?{...x}:{rsvp:'wait',side:SIDES[0]},o=>{o.plus=+o.plus||0;o.kids=+o.kids||0;if(x){if(x.rsvp!==o.rsvp&&o.rsvp==='yes')o.confirmedOn=iso(today());Object.assign(x,o)}else S.guests.push({id:uid(),...o});change()},o=>!o.name?'Podaj imię i nazwisko.':(+o.plus<0||+o.kids<0)?'Liczby nie mogą być ujemne.':'')}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',h=['Imię i nazwisko','Strona','RSVP','Osoby towarzyszące','Dzieci','Dieta','Alergie','Nocleg','Stół','Uwagi'];dl('goscie.csv','\ufeff'+[h.map(q).join(';'),...S.guests.map(g=>[g.name,g.side,RS[g.rsvp],g.plus,g.kids,g.diet,g.allergy,g.lodging?'tak':'',g.table,g.notes].map(q).join(';'))].join('\r\n'),'text/csv;charset=utf-8')}

V.formal=()=>{const s=S.settings,fv=F.filter(fvis);
const ch=`<div class="card"><h3>Jaką ceremonię planujecie?</h3>${Object.entries(CER).map(([k,l])=>`<label class="ck"><input type="checkbox" ${s.cer.includes(k)?'checked':''} onchange="togCer('${k}')">${l}</label>`).join('')}<div class="tools"><button class="g" onclick="persForm()">Doprecyzuj sytuację</button><button class="g" onclick="cityForm()">${s.city?'Miejscowość: '+esc(s.city):'Ustaw miejscowość'}</button></div></div>`;
return`<h1>Dokumenty i formalności</h1><div class="banner">Listy mają charakter ogólny i nie zostały zweryfikowane dla Waszej sytuacji. Aplikacja nie potwierdza aktualnych przepisów. Wymagania potwierdźcie w swoim USC i parafii.</div>${ch}
${fv.length?fv.map(f=>{const r=fget(f[0]),sel=f[2].filter(x=>s.cer.includes(x)).length;return`<div class="card"><div class="row" style="border:0;padding:0"><label class="ck" style="margin:0"><input type="checkbox" ${r.status==='gotowe'?'checked':''} onchange="togF('${f[0]}')"><b>${esc(f[1])}</b></label><span class="tag ${r.status==='gotowe'?'':'n'}">${r.status}</span></div><p style="margin:6px 0"><span class="tag n">${f[3]}</span> ${f[0][0]==='k'?'<span class="tag n">tylko ślub konkordatowy</span>':sel>1?'<span class="tag n">wspólne</span>':''} ${r.confirmed?'<span class="tag">potwierdzone przez urząd/parafię</span>':''} ${r.deadline&&r.status!=='gotowe'&&daysTo(r.deadline)<0?'<span class="tag w">po terminie</span>':''}</p><button class="g" onclick="where('${f[0]}')">Gdzie to załatwić?</button></div>`}).join(''):'<div class="empty card">Wybierzcie rodzaj ceremonii, a pokażemy odpowiednią listę. Jeśli jeszcze nie zdecydowaliście, możecie wrócić tu później.</div>'}`};
function togCer(k){const a=S.settings.cer;S.settings.cer=a.includes(k)?a.filter(x=>x!==k):[...a,k];change()}
function togF(id){const r=fget(id);r.status=r.status==='gotowe'?'do zdobycia':'gotowe';r.doneDate=r.status==='gotowe'?iso(today()):'';change()}
const persForm=()=>form('Doprecyzuj sytuację',[['prev','Któreś z nas było wcześniej w związku małżeńskim','check'],['foreign','Któreś z nas jest cudzoziemcem','check'],['outside','Planujemy ślub poza własną parafią','check']],S.settings,o=>{Object.assign(S.settings,o);change()});
const cityForm=()=>form('Miejscowość',[['city','Miejscowość ceremonii','text']],S.settings,o=>{S.settings.city=o.city;change()});
function where(id){const f=F.find(x=>x[0]===id),r=fget(id),civ=id[0]==='c'||id==='k2'||id==='k3'||id==='k6',city=S.settings.city;const d=$('#dlg');
d.innerHTML=`<h2>${esc(f[1])}</h2><p class="mut">${f[3]}. Informacja ogólna, niezweryfikowana dla Waszego urzędu lub parafii.</p><p><b>Gdzie się udać:</b> ${f[4]}</p><p><b>Co zrobić:</b> ${f[5]}</p><p><b>O co zapytać:</b> ${f[6]}</p><p><b>Kiedy:</b> ${f[7]} To termin orientacyjny, nie oficjalny.</p><p><b>Źródło:</b> ${civ?'<a href="https://www.gov.pl" target="_blank" rel="noopener">gov.pl</a> (serwis rządowy, sprawdźcie tam informacje o USC).':'strona Waszej parafii lub diecezji. Aplikacja nie zna jej adresu.'} ${city?`<a href="https://www.google.com/search?q=${encodeURIComponent((civ?'Urząd Stanu Cywilnego ':'parafia ')+city)}" target="_blank" rel="noopener">Wyszukaj: ${civ?'USC':'parafia'} ${esc(city)}</a> (zwykłe wyszukiwanie w Google, aplikacja niczego nie weryfikuje).`:'Ustawcie miejscowość w zakładce Formalności, aby dodać link do wyszukiwania.'}</p><hr style="border:0;border-top:1px solid var(--line)"><form id="f" novalidate><label>Status<select name="status">${FS.map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Osoba odpowiedzialna<input name="owner" value="${esc(r.owner)}"></label><label>Planowana data załatwienia<input type="date" name="plan" value="${r.plan}"></label><label>Termin ostateczny (tylko potwierdzony)<input type="date" name="deadline" value="${r.deadline}"></label><label class="ck"><input type="checkbox" name="confirmed" ${r.confirmed?'checked':''}>Potwierdzone przez urząd/parafię</label><label>Notatka<textarea name="note" rows="2">${esc(r.note)}</textarea></label><div class="tools"><button class="b" type="submit">Zapisz</button><button class="g" type="button" id="addp">Dodaj termin do mojego planu</button><button class="g" type="button" onclick="$('#dlg').close()">Zamknij</button></div></form>`;
const rd=()=>{const e=$('#f').elements;Object.assign(r,{status:e.status.value,owner:e.owner.value.trim(),plan:e.plan.value,deadline:e.deadline.value,confirmed:e.confirmed.checked,note:e.note.value.trim()});r.doneDate=r.status==='gotowe'?(r.doneDate||iso(today())):''};
$('#f').onsubmit=e=>{e.preventDefault();rd();d.close();change();toast('Zapisano')};
$('#addp').onclick=()=>{rd();const due=r.plan||r.deadline;if(!due){toast('Najpierw wpiszcie planowaną datę lub termin');return}const k='f_'+id;if(!S.tasks.some(t=>t.tpl===k))S.tasks.push({id:uid(),tpl:k,days:0,title:f[1],desc:f[5],cat:'Formalności',due,manual:true,done:false,owner:r.owner,prio:'średni'});else S.tasks.find(t=>t.tpl===k).due=due;d.close();change();toast('Dodano do zadań')};d.showModal()}
/* dane */
V.data=()=>{const s=S.settings;return`<h1>Dane i kopie zapasowe</h1><div class="card"><p>Wasze dane są zapisane <b>wyłącznie w tej przeglądarce, na tym urządzeniu</b>. Nie są wysyłane na żaden serwer i nie synchronizują się między urządzeniami. Aby przenieść je na inne urządzenie lub zabezpieczyć, użyjcie eksportu JSON.</p><div class="tools"><button class="b" onclick="exportJ()">Eksportuj JSON</button><label class="g" style="margin:0;cursor:pointer">Importuj JSON<input type="file" accept=".json,application/json" hidden onchange="importJ(this)"></label></div></div>
<div class="card"><h3>Podstawowe informacje</h3><div class="tools"><button class="b" onclick="onboard()">Edytuj imiona, datę i budżet</button><button class="g" onclick="confirmDel('Wszystkie dane w tej przeglądarce zostaną usunięte. Wcześniej zróbcie eksport JSON.',()=>{S=blank();save();page='dash';render()})">Usuń wszystkie dane</button></div></div>`};
const exportJ=()=>{dl(`planer-slubny-${iso(today())}.json`,JSON.stringify({app:'z-miloscia-krok-po-kroku',schemaVersion:VER,exportedAt:new Date().toISOString(),data:S},null,2),'application/json;charset=utf-8');toast('Wyeksportowano kopię')};
function importJ(inp){const file=inp.files[0];inp.value='';if(!file)return;const rd=new FileReader();rd.onerror=()=>toast('Nie udało się odczytać pliku');rd.onload=()=>{let n;try{const j=JSON.parse(rd.result);if(!j||j.app!=='z-miloscia-krok-po-kroku'||typeof j.schemaVersion!=='number'||!j.data)throw new Error('To nie jest plik kopii tej aplikacji.');if(j.schemaVersion>VER)throw new Error('Plik pochodzi z nowszej wersji aplikacji.');const d=j.data;['expenses','tasks','guests'].forEach(k=>{if(!Array.isArray(d[k]))throw new Error(`Brakuje poprawnej listy „${k}”.`)});if(typeof d.formal!=='object'||d.formal===null||typeof d.settings!=='object'||d.settings===null)throw new Error('Brakuje ustawień lub formalności.');n=migrate(d)}catch(e){const dd=$('#dlg');dd.innerHTML=`<h2>Nie można zaimportować pliku</h2><p class="err">${e instanceof SyntaxError?'Plik nie jest poprawnym JSON.':esc(e.message)}</p><p>Aktualne dane pozostały bez zmian.</p><button class="b" onclick="$('#dlg').close()">Zamknij</button>`;dd.showModal();return}
const dd=$('#dlg');dd.innerHTML=`<h2>Import danych</h2><p>W pliku: ${n.expenses.length} wydatków, ${n.tasks.length} zadań, ${n.guests.length} gości, ${Object.keys(n.formal).length} formalności.</p><p class="warn">Import zastąpi wszystkie obecne dane.</p><label class="ck"><input type="checkbox" id="bk" checked>Pobierz kopię obecnych danych przed importem</label><div class="tools"><button class="b" id="go">Zastąp dane</button><button class="g" onclick="$('#dlg').close()">Anuluj</button></div>`;$('#go').onclick=()=>{if($('#bk').checked)exportJ();S=n;recalc();save();dd.close();page='dash';render();toast('Zaimportowano dane')};dd.showModal()};rd.readAsText(file)}
const SIDES=['Panna Młoda','Pan Młody','Wspólni znajomi','Inna'],VST=['do sprawdzenia','do kontaktu','kontakt nawiązany','oferta otrzymana','porównuję oferty','negocjacje','zarezerwowany','umowa podpisana','rezygnacja'],BOOKED=['zarezerwowany','umowa podpisana'],VCAT=['Sala','Catering','Fotograf','Filmowiec','DJ lub zespół','Florysta','Dekorator','Makijażystka','Fryzjer','Cukiernia','Transport','Wynajem atrakcji','Koordynator','Inne'],VMAP={'Sala':'Sala i wynajem','Catering':'Catering','Fotograf':'Fotograf','Filmowiec':'Filmowiec','DJ lub zespół':'DJ lub zespół','Florysta':'Florystyka','Dekorator':'Dekoracje','Makijażystka':'Makijaż','Fryzjer':'Fryzura','Cukiernia':'Tort i słodki stół','Transport':'Transport','Wynajem atrakcji':'Atrakcje','Koordynator':'Koordynacja'};
function sideCard(){const t=gst().invited;return`<div class="card"><h3>Podział na strony</h3>${SIDES.map(s=>{const n=S.guests.filter(g=>g.side===s).reduce((a,g)=>a+persons(g),0);return`<div class="row"><span>${s}</span><span class="mut">${n} os.${t?' · '+Math.round(n/t*100)+'%':''}</span></div>`}).join('')}<div class="row"><b>Łącznie</b><b>${t} os.</b></div></div>`}
function tableOpts(cur){const n=S.tables.map(t=>t.name);return['',...n,...(cur&&!n.includes(cur)?[cur]:[])]}
function vendorField(e){const n=S.vendors.map(v=>v.name);return n.length?['vendor','Usługodawca','select',['',...n,...(e&&e.vendor&&!n.includes(e.vendor)?[e.vendor]:[])]]:['vendor','Usługodawca','text']}
const cmp=L=>`<div class="card" style="overflow-x:auto"><h3>Porównanie ofert</h3><table style="width:100%;border-collapse:collapse"><tr style="text-align:left"><th>Nazwa</th><th>Cena</th><th>Status</th><th>Ocena</th></tr>${[...L].sort((a,b)=>(a.price??1e12)-(b.price??1e12)).map(v=>`<tr><td>${esc(v.name)}</td><td>${pln(v.price)}</td><td>${v.status}</td><td>${v.rating||'—'}</td></tr>`).join('')}</table></div>`;
V.vendors=()=>{const f=flt.vc||'all',L=S.vendors.filter(v=>f==='all'||v.cat===f);return`<h1>Usługodawcy</h1><p class="mut">Dodanie na listę nie oznacza rezerwacji. Status zmieniacie sami. Koszty łączą się z budżetem przez nazwę usługodawcy w wydatku.</p><div class="tools"><button class="b" onclick="editVendor()">Dodaj usługodawcę</button><select aria-label="Kategoria" onchange="flt.vc=this.value;render()"><option value="all">Wszystkie kategorie</option>${VCAT.map(c=>`<option ${f===c?'selected':''}>${c}</option>`).join('')}</select></div>${f!=='all'&&L.length>1?cmp(L):''}${L.length?L.map(v=>{const ex=S.expenses.filter(e=>e.vendor===v.name),c=ex.reduce((a,e)=>a+(cost(e)||0),0),p=ex.reduce((a,e)=>a+paid(e),0);return`<div class="card"><div class="row" style="border:0;padding:0"><div><h3 style="margin:0">${esc(v.name)}</h3><span class="mut">${esc(v.cat)}${v.price!=null?' · oferta '+pln(v.price):''}${v.rating?' · ocena '+v.rating+'/5':''}</span></div><span class="tag ${BOOKED.includes(v.status)?'':v.status==='rezygnacja'?'w':'n'}">${v.status}</span></div><p class="mut" style="margin:8px 0">${[v.person,v.phone,v.email,v.booking&&'rezerwacja '+fd(v.booking),v.contract&&'umowa do '+fd(v.contract),v.notes].filter(Boolean).map(esc).join(' · ')}${/^https?:\/\//.test(v.url||'')?` · <a href="${esc(v.url)}" target="_blank" rel="noopener">strona</a>`:''}</p>${ex.length?`<p class="mut" style="margin:0 0 8px">Powiązane wydatki: ${ex.length}. Koszt ${pln(c)}, wpłacono ${pln(p)}.</p>`:''}<div class="tools" style="margin:0"><button class="g" onclick="editVendor('${v.id}')">Edytuj</button>${ex.length?'':`<button class="g" onclick="vendorExp('${v.id}')">Utwórz wydatek</button>`}<button class="g" onclick="confirmDel('Usunąć usługodawcę? Wydatki w budżecie zostaną.',()=>{S.vendors=S.vendors.filter(x=>x.id!=='${v.id}');change()})">Usuń</button></div></div>`}).join(''):'<div class="empty card">Brak usługodawców. Dodajcie pierwszą osobę lub firmę do sprawdzenia.</div>'}`};
function editVendor(id){const v=id&&S.vendors.find(x=>x.id===id);form(v?'Edytuj usługodawcę':'Nowy usługodawca',[['name','Nazwa','text'],['cat','Kategoria','select',VCAT],['status','Status','select',VST],['person','Osoba kontaktowa','text'],['phone','Telefon','text'],['email','E-mail','email'],['url','Strona internetowa','text'],['price','Cena oferty (PLN)','money'],['booking','Data rezerwacji','date'],['contract','Termin podpisania umowy','date'],['rating','Ocena (1–5)','select',['','1','2','3','4','5']],['notes','Ustalenia i notatki','area']],v||{cat:VCAT[0],status:VST[0]},o=>{if(v){if(v.name!==o.name)S.expenses.forEach(e=>{if(e.vendor===v.name)e.vendor=o.name});Object.assign(v,o)}else S.vendors.push({id:uid(),...o});change()},o=>!o.name?'Podaj nazwę.':S.vendors.some(x=>x.name===o.name&&(!v||x.id!==v.id))?'Usługodawca o tej nazwie już istnieje.':'')}
function vendorExp(id){const v=S.vendors.find(x=>x.id===id);if(S.expenses.some(e=>e.vendor===v.name))return;S.expenses.push({id:uid(),payments:[],name:v.cat+': '+v.name,cat:VMAP[v.cat]||'Inne',vendor:v.name,planned:v.price});change();toast('Dodano wydatek w budżecie')}
const occ=t=>S.guests.filter(g=>g.table===t.name&&g.rsvp!=='no').reduce((a,g)=>a+persons(g),0);
const tsel=g=>`<select style="width:auto" aria-label="Stół dla ${esc(g.name)}" onchange="assign('${g.id}',this.value)"><option value="">${g.table?'Zdejmij ze stołu':'Wybierz stół'}</option>${S.tables.map(t=>`<option ${g.table===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`;
V.tables=()=>{const un=S.guests.filter(g=>!g.table&&g.rsvp!=='no');return`<h1>Plan stołów</h1><p class="mut">Widok listowy oparty na liście gości. Każda osoba ma jeden stół. Odmowy nie zajmują miejsc.</p><div class="tools"><button class="b" onclick="editTable()">Dodaj stół</button></div>${S.tables.map(t=>{const o=occ(t);return`<div class="card"><div class="row" style="border:0;padding:0"><h3 style="margin:0">${esc(t.name)}</h3><span class="tag ${o>t.seats?'w':o===t.seats?'':'n'}">${o}/${t.seats} miejsc${o>t.seats?' · za dużo osób':''}</span></div>${S.guests.filter(g=>g.table===t.name).map(g=>`<div class="row"><span>${esc(g.name)} <span class="mut">${persons(g)} os.${g.rsvp==='no'?' · odmowa':''}</span></span>${tsel(g)}</div>`).join('')||'<p class="mut">Brak gości przy tym stole.</p>'}<div class="tools" style="margin:8px 0 0"><button class="g" onclick="editTable('${t.id}')">Edytuj</button><button class="g" onclick="confirmDel('Usunąć stół? Goście zostaną bez przypisania.',()=>{S.guests.forEach(g=>{if(g.table==='${esc(t.name).replace(/'/g,'')}')g.table=''});S.tables=S.tables.filter(x=>x.id!=='${t.id}');change()})">Usuń</button></div></div>`}).join('')||'<div class="empty card">Nie ma jeszcze stołów. Dodajcie pierwszy i wybierzcie liczbę miejsc.</div>'}<div class="card"><h3>Bez stołu (${un.length})</h3>${un.map(g=>`<div class="row"><span>${esc(g.name)} <span class="mut">${persons(g)} os.</span></span>${S.tables.length?tsel(g):''}</div>`).join('')||'<p class="mut">Wszyscy goście mają stół.</p>'}</div>`};
function assign(gid,name){const g=S.guests.find(x=>x.id===gid);g.table=name;const t=S.tables.find(x=>x.name===name);change();if(t&&occ(t)>t.seats)toast('Uwaga: przy stole jest więcej osób niż miejsc')}
function editTable(id){const t=id&&S.tables.find(x=>x.id===id);form(t?'Edytuj stół':'Nowy stół',[['name','Nazwa lub numer','text'],['seats','Liczba miejsc','number']],t||{seats:8},o=>{o.seats=+o.seats;if(t){if(t.name!==o.name)S.guests.forEach(g=>{if(g.table===t.name)g.table=o.name});Object.assign(t,o)}else S.tables.push({id:uid(),...o});change()},o=>!o.name?'Podaj nazwę lub numer stołu.':S.tables.some(x=>x.name===o.name&&(!t||x.id!==t.id))?'Stół o tej nazwie już istnieje.':!(+o.seats>=1)?'Liczba miejsc musi wynosić co najmniej 1.':'')}
const gcol=g=>{const i=S.groups.indexOf(g.group);return i<0?'var(--line)':`hsl(${(i*67+15)%360} 42% 55%)`};
const cnt=g=>g.rsvp==='no'?0:persons(g);
const sz=a=>a.reduce((s,g)=>s+persons(g),0);

V.tables=()=>{const un=S.guests.filter(g=>!g.table&&g.rsvp!=='no'),by={};un.forEach(g=>{const k=g.group||'Bez grupy';(by[k]=by[k]||[]).push(g)});const rc=t=>t.shape==='prostokątny';
return`<h1>Plan stołów</h1><p class="mut">Przeciągnijcie gościa na stół. Na telefonie użyjcie listy wyboru obok nazwiska. Aplikacja nie pozwoli przekroczyć liczby miejsc. Kolor paska przy nazwisku oznacza grupę.</p><div class="tools"><button class="b" onclick="editTable()">Dodaj stół</button><button class="g" onclick="suggest()">Zaproponuj rozmieszczenie wg grup</button></div>
<div class="tp"><div>${S.tables.map(t=>{const o=occ(t),gs=S.guests.filter(g=>g.table===t.name);return`<div class="card" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="drop(event,'${t.id}')"><div class="row" style="border:0;padding:0"><div style="display:flex;gap:12px;align-items:center"><div class="tbl ${rc(t)?'rc':'rd'}">${esc(t.name)}</div><div><b>${rc(t)?'prostokątny':'okrągły'}</b><br><span class="tag ${o>t.seats?'w':o===t.seats?'':'n'}">${o}/${t.seats} miejsc</span></div></div><div class="tools" style="margin:0"><button class="g" onclick="editTable('${t.id}')">Edytuj</button><button class="g" onclick="delTable('${t.id}')">Usuń</button></div></div><div>${Array.from({length:Math.min(t.seats,30)},(_,i)=>`<i class="dot ${i<o?'f':''}"></i>`).join('')}</div><div>${gs.map(g=>chip(g,1)).join('')||'<p class="mut">Brak gości. Przeciągnijcie kogoś tutaj.</p>'}</div></div>`}).join('')||'<div class="empty card">Nie ma jeszcze stołów. Dodajcie pierwszy i wybierzcie kształt oraz liczbę miejsc.</div>'}</div>
<div><div class="card" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="drop(event,'')"><h3>Bez stołu (${un.length})</h3>${Object.keys(by).map(k=>`<p class="mut" style="margin:8px 0 2px">${esc(k)}</p>${by[k].map(g=>`<div class="row" style="padding:4px 0">${chip(g)}${S.tables.length?tsel(g):''}</div>`).join('')}`).join('')||'<p class="mut">Wszyscy goście mają stół.</p>'}</div>
<div class="card"><h3>Rozpis</h3>${S.tables.map(t=>{const gs=S.guests.filter(g=>g.table===t.name&&g.rsvp!=='no');return`<p style="margin:0 0 8px"><b>${esc(t.name)}:</b> ${gs.length?gs.map(g=>esc(g.name)+(persons(g)>1?' (+'+(persons(g)-1)+')':'')).join(', '):'<span class="mut">wolny</span>'}</p>`}).join('')||'<p class="mut">Brak stołów.</p>'}</div></div></div>`};
function assign(gid,name){const g=S.guests.find(x=>x.id===gid),t=S.tables.find(x=>x.name===name);if(t){const free=t.seats-occ(t)+(g.table===name?cnt(g):0);if(cnt(g)>free){toast(`Stół „${t.name}” ma wolnych miejsc: ${Math.max(free,0)}, a ${g.name} to ${cnt(g)} os.`);render();return}}g.table=name;change()}
function drop(e,tid){e.preventDefault();const gid=e.dataTransfer.getData('text/plain');if(!S.guests.some(g=>g.id===gid))return;const t=S.tables.find(x=>x.id===tid);assign(gid,t?t.name:'')}
function delTable(id){const t=S.tables.find(x=>x.id===id);confirmDel('Usunąć stół? Goście zostaną bez przypisania.',()=>{S.guests.forEach(g=>{if(g.table===t.name)g.table=''});S.tables=S.tables.filter(x=>x.id!==id);change()})}
function editTable(id){const t=id&&S.tables.find(x=>x.id===id);form(t?'Edytuj stół':'Nowy stół',[['name','Nazwa lub numer','text'],['shape','Kształt','select',['okrągły','prostokątny']],['seats','Liczba miejsc','number']],t||{seats:8,name:'Stół '+(S.tables.length+1),shape:'okrągły'},o=>{o.seats=+o.seats;if(t){if(t.name!==o.name)S.guests.forEach(g=>{if(g.table===t.name)g.table=o.name});Object.assign(t,o)}else S.tables.push({id:uid(),...o});change()},o=>!o.name?'Podaj nazwę lub numer stołu.':S.tables.some(x=>x.name===o.name&&(!t||x.id!==t.id))?'Stół o tej nazwie już istnieje.':!(+o.seats>=1)?'Liczba miejsc musi wynosić co najmniej 1.':'')}
function plan(){const free={},inT={};S.tables.forEach(t=>{free[t.id]=t.seats-occ(t);inT[t.id]=new Set(S.guests.filter(g=>g.table===t.name&&g.group).map(g=>g.group))});const by={};S.guests.filter(g=>!g.table&&g.rsvp!=='no').forEach(g=>{const k=g.group||'Bez grupy';(by[k]=by[k]||[]).push(g)});const res=[],left=[];
Object.entries(by).sort((a,b)=>sz(b[1])-sz(a[1])).forEach(([k,gs])=>{let rest=sz(gs);gs.forEach(g=>{const p=persons(g),c=S.tables.filter(t=>free[t.id]>=p),t=c.find(t=>inT[t.id].has(k))||c.filter(t=>free[t.id]>=rest).sort((a,b)=>free[a.id]-free[b.id])[0]||c.sort((a,b)=>free[b.id]-free[a.id])[0];if(!t){left.push(g);return}free[t.id]-=p;inT[t.id].add(k);res.push([g,t]);rest-=p})});return{res,left}}
function suggest(){if(!S.tables.length){toast('Najpierw dodajcie stoły');return}const{res,left}=plan();if(!res.length&&!left.length){toast('Wszyscy mają już stół');return}const d=$('#dlg');d.innerHTML=`<h2>Propozycja rozmieszczenia</h2><p class="mut">Goście z tej samej grupy siadają razem, o ile pozwala liczba miejsc. To tylko propozycja, możecie ją potem zmienić.</p>${S.tables.map(t=>{const a=res.filter(r=>r[1]===t);return a.length?`<p><b>${esc(t.name)}:</b> ${a.map(r=>esc(r[0].name)).join(', ')}</p>`:''}).join('')}${left.length?`<p class="warn">Bez miejsca: ${left.map(g=>esc(g.name)).join(', ')}. Dodajcie stół lub miejsca.</p>`:''}<div class="tools"><button class="b" id="ap">Zastosuj</button><button class="g" onclick="$('#dlg').close()">Anuluj</button></div>`;$('#ap').onclick=()=>{res.forEach(([g,t])=>{g.table=t.name});d.close();change();toast('Zastosowano propozycję')};d.showModal()}

cze nic nie ma. Dodajcie pierwszą inspirację albo zdjęcie przymierzonej stylizacji.</div>'}</div>`};

function editInsp(id){const i=id&&S.insp.find(x=>x.id===id);form(i?'Edytuj inspirację':'Nowa inspiracja',[['board','Dla kogo lub czego','select',BO],['kind','Rodzaj','select',['inspiracja','przymierzone']],['title','Tytuł','text'],['note','Notatka','area'],['url','Link (opcjonalnie)','text']],i||{board:flt.ib&&flt.ib!=='all'?flt.ib:BO[0],kind:'inspiracja'},o=>{if(i)Object.assign(i,o);else S.insp.push({id:uid(),fav:false,status:'',img:'',...o});change();toast('Zapisano')},req('title','Podaj tytuł.'))}
function pick(id){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.insp.find(x=>x.id===id).img=c.toDataURL('image/jpeg',.72);change()};im.onerror=()=>toast('Nie udało się wczytać zdjęcia');im.src=r.result};r.readAsDataURL(file)};f.click()}
V.mood=()=>{const s=S.settings,pool=S.insp.filter(i=>i.status!=='odrzucona');const secs=BO.map((b,bi)=>{const a=pool.filter(i=>i.board===b),p=a.filter(i=>i.fav||i.status==='zaakceptowana'),use=[...(p.length?p:a)].sort((x,y)=>sc(y)-sc(x)).slice(0,6);return use.length?`<h3 style="margin:18px 0 8px">${esc(b)}</h3><div class="mg">${use.map(i=>`<div class="tile" style="${i.img?'':`background:hsl(${(bi*43+20)%360} 35% 86%)`}">${i.img?`<img src="${i.img}" alt="${esc(i.title)}">`:''}<span>${esc(i.title)}</span></div>`).join('')}</div>`:''}).join('');return`<h1>Mood board ślubu${s.n1?': '+esc([s.n1,s.n2].filter(Boolean).join(' i ')):''}</h1><p class="mut">Do mood boardu trafiają ulubione i zaakceptowane inspiracje z każdej tablicy (a jeśli ich nie ma, wszystkie nieodrzucone), maks. 6 na tablicę. Najpierw pokazujemy te ze zdjęciem.${s.date?' ślub: '+fd(s.date)+'.':''}</p><div class="tools"><button class="g" onclick="go('insp')">Wróć do inspiracji</button><button class="b" onclick="window.print()">Drukuj lub zapisz jako PDF</button></div>${secs||'<div class="empty card">Mood board powstanie z Waszych inspiracji. Dodajcie je w zakładce Inspiracja.</div>'}`};

aniczoną mobilnością: wygodna droga, bez ciasnych przejść','Rodzice z małymi dziećmi: miejsce na wózek, spokojniejszy kąt','Alergie: informacja dla obsługi bez publicznego ujawniania szczegółów','Goście, którzy nikogo nie znają: obok życzliwych osób','Obsługa dostaje aktualny, czytelny plan stołów']],['e1','Po ślubie',['Odbiór sukni, garnituru, dekoracji, prezentów i rzeczy z sali','Rozliczenie płatności i sprawdzenie faktur','Podziękowanie usługodawcom i bliskim','Kopie zdjęć i filmu w co najmniej dwóch miejscach','Formalności związane z nazwiskiem i dokumentami (jeśli dotyczy)','Co zrobić z kwiatami, jedzeniem i dekoracjami','Czas na odpoczynek']],['w1','Tygodniowy rytuał planowania (20–30 minut)',['Co udało się załatwić w tym tygodniu?','Co jest najważniejsze w następnym tygodniu?','Czy coś przekracza budżet albo nasze siły?','Czy potrzebujemy pomocy? Od kogo?','Co możemy odpuścić?','Co zrobimy razem tylko dla przyjemności?']]];
const openL={};
V.lists=()=>{const s=S.settings;return`<h1>Listy z planera</h1><div class="card"><h3>Wasza wizja</h3><p class="mut">Chcę czuć: ${esc(s.feel)||'—'}<br>Trzy słowa o naszym ślubie: ${esc(s.words)||'—'}</p><button class="g" onclick="visForm()">Edytuj wizję</button></div><p class="mut">Odhaczajcie pozycje, dodawajcie notatki (ustalenia, odpowiedzi, kontakty) i własne pozycje.</p>${LS.map(([id,t,items])=>{const all=[...items.map((x,i)=>({id:id+'.'+i,t:x})),...(S.custom[id]||[]).map(c=>({...c,own:1}))],d=all.filter(x=>(S.chk[x.id]||{}).done).length;return`<details class="card" ${openL[id]?'open':''} ontoggle="openL['${id}']=this.open"><summary><b>${esc(t)}</b> <span class="tag n">${d}/${all.length}</span></summary>${all.map(x=>{const c=S.chk[x.id]||{};return`<div class="row"><label class="ck" style="margin:0"><input type="checkbox" ${c.done?'checked':''} onchange="togChk('${x.id}')"><span>${esc(x.t)}</span></label><span>${c.note?`<span class="mut">${esc(c.note)}</span> `:''}<button class="g" onclick="noteChk('${x.id}')">Notatka</button>${x.own?`<button class="x" aria-label="Usuń pozycję" onclick="delOwn('${id}','${x.id}')">×</button>`:''}</span></div>`}).join('')}<div class="tools" style="margin:10px 0 0"><button class="g" onclick="addOwn('${id}')">Dodaj własną pozycję</button></div></details>`}).join('')}`};
const togChk=id=>{const c=S.chk[id]||(S.chk[id]={});c.done=!c.done;change()};
const noteChk=id=>form('Notatka',[['note','Treść','area']],S.chk[id]||{},o=>{(S.chk[id]||(S.chk[id]={})).note=o.note;change()});
const addOwn=l=>form('Własna pozycja',[['t','Treść','text']],{},o=>{(S.custom[l]=S.custom[l]||[]).push({id:l+'.c'+uid(),t:o.t});change()},req('t','Wpisz treść pozycji.'));
const delOwn=(l,id)=>{S.custom[l]=S.custom[l].filter(x=>x.id!==id);delete S.chk[id];change()};
const visForm=()=>form('Wasza wizja',[['feel','Gdy wyobrażam sobie ten dzień, chcę czuć…','area'],['words','Trzy słowa opisujące nasz ślub','text']],S.settings,o=>{Object.assign(S.settings,o);change()});
load();recalc();render();
</script></body></html>
